<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <title>Roberts Rep - Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8f7f4;
        color: #1d1d1f;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(100%, 440px);
        border: 1px solid #e7e2d9;
        border-radius: 28px;
        background: #fff;
        padding: 32px;
        text-align: center;
        box-shadow: 0 18px 45px rgba(7, 17, 31, 0.12);
      }
      .icon {
        width: 92px;
        height: 92px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border-radius: 24px;
        background: #07111f;
        color: #d4af37;
        font-size: 48px;
        font-weight: 900;
      }
      h1 { margin: 0; color: #07111f; font-size: 30px; }
      p { margin: 14px 0 0; color: #6b6257; line-height: 1.6; }
      button {
        margin-top: 24px;
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 15px 18px;
        background: #d4af37;
        color: #07111f;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">R</div>
      <h1>You are offline</h1>
      <p>
        Roberts Rep needs an internet connection to load current bookings,
        payments, inspections, and customer records.
      </p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </main>
  </body>
</html>
